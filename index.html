<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Valise de secours - Jeux de société</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #1a2a2f;
            margin: 0;
            padding: 16px;
        }
        .app {
            max-width: 800px;
            margin: 0 auto;
        }
        .tab-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            background: #0f1a1f;
            padding: 12px;
            border-radius: 60px;
        }
        .tab-btn {
            background: #2d4a5a;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
        }
        .tab-btn.active {
            background: #f4a261;
            color: #1a2a2f;
        }
        .tab-content {
            display: none;
            background: #2d4a5a;
            border-radius: 32px;
            padding: 20px;
            color: #f0f0f0;
        }
        .tab-content.active {
            display: block;
        }
        button {
            background: #f4a261;
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin: 4px;
        }
        .money-area, .players-area {
            background: #1e3a44;
            padding: 16px;
            border-radius: 24px;
            margin: 12px 0;
        }
        .bill {
            display: inline-block;
            background: #2a6b47;
            padding: 8px 14px;
            margin: 5px;
            border-radius: 12px;
            font-weight: bold;
        }
        .dice-result {
            font-size: 3rem;
            text-align: center;
            background: #0f1a1f;
            padding: 20px;
            border-radius: 24px;
            font-family: monospace;
        }
        .yahtzee-grid {
            font-size: 0.8rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e3a44;
        }
        td, th {
            border: 1px solid #4a7c8c;
            padding: 8px;
            text-align: center;
        }
        input {
            width: 60px;
            text-align: center;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            padding: 4px;
        }
        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        hr {
            border-color: #4a7c8c;
            margin: 16px 0;
        }
        @media (max-width: 600px) {
            .tab-btn { font-size: 0.7rem; padding: 8px 12px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="monopoly">🏦 Monopoly</button>
        <button class="tab-btn" data-tab="cards">🎴 Cartes</button>
        <button class="tab-btn" data-tab="risk">⚔️ Risk</button>
        <button class="tab-btn" data-tab="yahtzee">🎲 Yahtzee</button>
        <button class="tab-btn" data-tab="dnd">🐉 D&D</button>
    </div>

    <!-- MONOPOLY -->
    <div id="monopoly" class="tab-content active">
        <h2>🏦 Banquier Monopoly</h2>
        <div class="money-area">
            <div id="bankMoney">💰 Banque : 15 000 $</div>
            <div class="flex">
                <button onclick="addBill(1)">+1$</button>
                <button onclick="addBill(5)">+5$</button>
                <button onclick="addBill(10)">+10$</button>
                <button onclick="addBill(20)">+20$</button>
                <button onclick="addBill(50)">+50$</button>
                <button onclick="addBill(100)">+100$</button>
                <button onclick="addBill(500)">+500$</button>
                <button onclick="resetBank()">🏦 Reset</button>
            </div>
        </div>
        <div class="players-area">
            <h3>Joueurs</h3>
            <div id="playersList"></div>
            <button onclick="addPlayerMoney()">➕ Ajouter joueur</button>
        </div>
    </div>

    <!-- CARTES Monopoly -->
    <div id="cards" class="tab-content">
        <h2>🎴 Chance / Caisse Commune</h2>
        <div class="flex">
            <button onclick="drawCard('chance')">🎲 Piocher Chance</button>
            <button onclick="drawCard('commune')">📬 Piocher Caisse Commune</button>
        </div>
        <div id="cardResult" style="background:#1e3a44; padding:20px; border-radius:20px; margin-top:16px; font-size:1.2rem;"></div>
    </div>

    <!-- RISK -->
    <div id="risk" class="tab-content">
        <h2>⚔️ Combat Risk</h2>
        <div class="flex">
            <div><strong>Attaquant (<=3 dés)</strong><br><button onclick="rollRisk('attack')">Lancer Attaque</button><br><span id="attackDice">-</span></div>
            <div><strong>Défenseur (<=2 dés)</strong><br><button onclick="rollRisk('defend')">Lancer Défense</button><br><span id="defendDice">-</span></div>
        </div>
        <div id="riskResult" style="margin-top:16px; font-weight:bold;"></div>
        <button onclick="compareRisk()">⚔️ Comparer résultats</button>
    </div>

    <!-- YAHTZEE -->
    <div id="yahtzee" class="tab-content">
        <h2>📜 Feuille Yahtzee</h2>
        <div class="yahtzee-grid" id="yahtzeeSheet"></div>
        <button onclick="resetYahtzee()">🔄 Nouvelle partie</button>
    </div>

    <!-- DONJONS & DRAGONS -->
    <div id="dnd" class="tab-content">
        <h2>🐉 Donjons & Dragons</h2>
        <div class="flex">
            <button onclick="rollDnD(4)">D4</button>
            <button onclick="rollDnD(6)">D6</button>
            <button onclick="rollDnD(8)">D8</button>
            <button onclick="rollDnD(10)">D10</button>
            <button onclick="rollDnD(12)">D12</button>
            <button onclick="rollDnD(20)">D20</button>
            <button onclick="rollDnD(100)">D100</button>
        </div>
        <div id="dndResult" class="dice-result">🎲 Clique un dé</div>
        <hr>
        <h3>🏃 Initiative</h3>
        <input type="text" id="initName" placeholder="Nom personnage">
        <button onclick="addInitiative()">Ajouter initiative</button>
        <div id="initList"></div>
        <button onclick="rollAllInit()">🎲 Lancer initiative pour tous</button>
    </div>
</div>

<script>
    // ---------- MONOPOLY ----------
    let bank = 15000;
    let monopolyPlayers = [{name:"Joueur 1", money:1500}];
    function updateBankDisplay() { document.getElementById("bankMoney").innerHTML = `💰 Banque : ${bank} $`; }
    function updatePlayersDisplay() {
        let html = '';
        monopolyPlayers.forEach((p,idx) => {
            html += `<div style="background:#1e3a44; margin:8px; padding:12px; border-radius:20px;">
                        <strong>${p.name}</strong> : ${p.money} $
                        <button onclick="transferToBank(${idx})">💰→Banque</button>
                        <button onclick="transferFromBank(${idx})">🏦→${p.name}</button>
                        <button onclick="renamePlayer(${idx})">✏️</button>
                     </div>`;
        });
        document.getElementById("playersList").innerHTML = html;
    }
    window.addBill = (val) => { bank += val; updateBankDisplay(); };
    window.resetBank = () => { bank = 15000; updateBankDisplay(); };
    window.addPlayerMoney = () => { monopolyPlayers.push({name:`Joueur ${monopolyPlayers.length+1}`, money:1500}); updatePlayersDisplay(); };
    window.transferToBank = (idx) => { let amt = prompt("Montant à donner à la banque ?"); if(amt && !isNaN(amt)){ monopolyPlayers[idx].money -= parseInt(amt); bank += parseInt(amt); updateBankDisplay(); updatePlayersDisplay(); } };
    window.transferFromBank = (idx) => { let amt = prompt("Montant à retirer de la banque ?"); if(amt && !isNaN(amt)){ monopolyPlayers[idx].money += parseInt(amt); bank -= parseInt(amt); updateBankDisplay(); updatePlayersDisplay(); } };
    window.renamePlayer = (idx) => { let newName = prompt("Nouveau nom", monopolyPlayers[idx].name); if(newName) monopolyPlayers[idx].name = newName; updatePlayersDisplay(); };
    updateBankDisplay(); updatePlayersDisplay();

    // ---------- CARTES ----------
    const chanceCards = [
        "Avancez à la case Départ → 200$", "Banque vous verse 50$", "Amende pour excès de vitesse → 15$", "Votre immeuble rapporte → 150$",
        "Reculez de 3 cases", "Allez en prison", "Sortez de prison gratuit", "Faites des réparations → 40$ par maison",
        "Vous avez gagné au concours → 100$", "Payez 10$ ou tirez Chance"
    ];
    const communeCards = [
        "Erreur banque → 200$", "Payez 50$", "Héritage → 100$", "Amende → 20$", "Vente de actions → 50$",
        "Aller en prison", "Sortez de prison", "Remboursement impôts → 20$", "Honoraires médecins → 50$"
    ];
    window.drawCard = (type) => {
        let deck = type === 'chance' ? chanceCards : communeCards;
        let card = deck[Math.floor(Math.random() * deck.length)];
        document.getElementById("cardResult").innerHTML = `<strong>${type === 'chance' ? '🎲 CHANCE' : '📬 CAISSE COMMUNE'}</strong><br>${card}`;
    };

    // ---------- RISK ----------
    let attackRolls = [], defendRolls = [];
    window.rollRisk = (side) => {
        if(side === 'attack'){ attackRolls = []; for(let i=0;i<3;i++) attackRolls.push(Math.floor(Math.random()*6)+1); attackRolls.sort((a,b)=>b-a); document.getElementById("attackDice").innerHTML = attackRolls.join(", "); }
        else { defendRolls = []; let maxDice = (Math.floor(Math.random()*2)+1); for(let i=0;i<maxDice;i++) defendRolls.push(Math.floor(Math.random()*6)+1); defendRolls.sort((a,b)=>b-a); document.getElementById("defendDice").innerHTML = defendRolls.join(", "); }
    };
    window.compareRisk = () => {
        let att = attackRolls.slice(), def = defendRolls.slice();
        let lossesA=0, lossesD=0;
        for(let i=0; i<Math.min(att.length, def.length); i++){
            if(att[i] > def[i]) lossesD++;
            else lossesA++;
        }
        document.getElementById("riskResult").innerHTML = `🔥 Attaquant perd ${lossesA} unité(s) · 🛡️ Défenseur perd ${lossesD} unité(s)`;
    };

    // ---------- YAHTZEE ----------
    let categories = ["As","2","3","4","5","6","Brelan","Carré","Full","Pte Suite","Grde Suite","Yahtzee","Chance"];
    let yahtzeeScores = { "J1": Array(13).fill(null) };
    function renderYahtzee(){
        let html = "<table><tr><th>Catégorie</th><th>J1</th></tr>";
        categories.forEach((cat,i) => {
            let val = yahtzeeScores["J1"][i] !== null ? yahtzeeScores["J1"][i] : "";
            html += `<tr><td>${cat}</td><td><input type="number" id="score_${i}" value="${val}" placeholder="0"></td></tr>`;
        });
        html += "</table><button onclick='saveYahtzee()'>💾 Sauvegarder scores</button>";
        document.getElementById("yahtzeeSheet").innerHTML = html;
    }
    window.saveYahtzee = () => {
        categories.forEach((_,i) => {
            let val = document.getElementById(`score_${i}`).value;
            yahtzeeScores["J1"][i] = val === "" ? null : parseInt(val);
        });
        alert("Scores sauvegardés !");
    };
    window.resetYahtzee = () => { yahtzeeScores["J1"] = Array(13).fill(null); renderYahtzee(); };
    renderYahtzee();

    // ---------- DONJONS & DRAGONS ----------
    window.rollDnD = (sides) => {
        let result = Math.floor(Math.random() * sides) + 1;
        document.getElementById("dndResult").innerHTML = `🎲 D${sides} : ${result}`;
    };
    let initiatives = [];
    function updateInitDisplay(){
        let html = "<ul>";
        initiatives.sort((a,b)=>b.init - a.init).forEach(p => { html += `<li>${p.name} : initiative ${p.init}</li>`; });
        html += "</ul>";
        document.getElementById("initList").innerHTML = html;
    }
    window.addInitiative = () => {
        let name = document.getElementById("initName").value;
        if(name) { initiatives.push({name, init:0}); document.getElementById("initName").value=""; updateInitDisplay(); }
    };
    window.rollAllInit = () => {
        initiatives.forEach(p => p.init = Math.floor(Math.random()*20)+1);
        updateInitDisplay();
    };
    updateInitDisplay();

    // ---------- Onglets ----------
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });
</script>
</body>
</html>
